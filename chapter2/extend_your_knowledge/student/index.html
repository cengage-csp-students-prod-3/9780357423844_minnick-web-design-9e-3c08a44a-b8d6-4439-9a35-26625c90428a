<!DOCTYPE html>
<html>
<head>
    <title>HTML Manipulation</title>
</head>
<body>
    <div>This is a div element.</div>
    <div>Another div element.</div>
    <p>This is a paragraph element.</p>
    <p>This is another paragraph element.</p>
    <div>Main content area:</div>
    <p>Paragraph 1 in the main content area.</p>
    <p>Paragraph 2 in the main content area.</p>
    <div>Navigation section:</div>
    <p>Perceivable</p>
    <p>Operable</p>
    <p>Understandable</p>

    <script>
        // Locate all div elements and change them to semantic elements
        const divElements = document.querySelectorAll('div');
        divElements.forEach((div) => {
            let newElement;
            if (div.textContent.includes("Main content area:")) {
                newElement = document.createElement('main');
            } else if (div.textContent.includes("Navigation section:")) {
                newElement = document.createElement('nav');
            } else {
                newElement = document.createElement('section');
            }
            newElement.textContent = div.textContent;
            div.replaceWith(newElement);
        });

        // Update the 3rd paragraph element to use an h1
        const paragraph15 = document.querySelector('p:nth-of-type(3)');
        const h1Element = document.createElement('h1');
        h1Element.textContent = paragraph15.textContent;
        paragraph15.replaceWith(h1Element);

        // Wrap all main content paragraphs inside one article
        const mainContent = document.querySelector('main');
        const paragraphsInMainContent = [];
        let nextElem = mainContent.nextElementSibling;
        while (nextElem && nextElem.tagName === "P") {
            paragraphsInMainContent.push(nextElem);
            nextElem = nextElem.nextElementSibling;
        }

        const articleElement = document.createElement('article');
        paragraphsInMainContent.forEach((paragraph, index) => {
            if (index === 0) {
                const h2Element = document.createElement('h2');
                h2Element.textContent = paragraph.textContent;
                articleElement.appendChild(h2Element);
            } else {
                const pElement = document.createElement('p');
                pElement.textContent = paragraph.textContent;
                articleElement.appendChild(pElement);
            }
            paragraph.remove(); // remove original p
        });
        mainContent.insertAdjacentElement('afterend', articleElement);

        // Add a black small square before each sentence inside article
        articleElement.querySelectorAll('p').forEach((p) => {
            p.innerHTML = '&#9642; ' + p.innerHTML;
        });

        // Add a nonbreaking space + black circle after each word in navigation section
        const navigationSection = document.querySelector('nav');
        let navElem = navigationSection.nextElementSibling;
        while (navElem && navElem.tagName === "P") {
            navElem.innerHTML = navElem.textContent.replace(/\b(\w+)\b/g, '$1&nbsp;&#9679;');
            navElem = navElem.nextElementSibling;
        }
    </script>
</body>
</html>
