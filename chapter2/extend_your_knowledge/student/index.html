<!DOCTYPE html>
<html>
<head>
    <title>HTML Manipulation</title>
</head>
<body>
    <div>This is a div element.</div>
    <div>Another div element.</div>
    <p>This is a paragraph element.</p>
    <p>This is another paragraph element.</p>
    <div>Main content area:</div>
    <p>Paragraph 1 in the main content area.</p>
    <p>Paragraph 2 in the main content area.</p>
    <div>Navigation section:</div>
    <p>Perceivable</p>
    <p>Operable</p>
    <p>Understandable</p>

    <script>
        // Change the FIRST <p> into an <h2>
        const firstParagraph = document.querySelector('p');
        if (firstParagraph) {
            const h2 = document.createElement('h2');
            h2.textContent = firstParagraph.textContent;
            firstParagraph.replaceWith(h2);
        }

        // Wrap ALL remaining <p> elements inside a single <article>
        const allParagraphs = document.querySelectorAll('p');
        if (allParagraphs.length > 0) {
            const article = document.createElement('article');
            allParagraphs.forEach(p => {
                article.appendChild(p.cloneNode(true));
                p.remove();
            });
            document.body.appendChild(article);
        }
    </script>
</body>
</html>
